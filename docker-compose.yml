services:
  # 1. Production MQTT Broker Container
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: drone-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - drone-net

  # 2. Node.js Backend & WebSocket Dashboard Container
  dashboard-server:
    build: .
    container_name: drone-dashboard-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    depends_on:
      - mosquitto
    networks:
      - drone-net

  # 3. Simulated Drone Container
  drone-simulator:
    build: .
    container_name: drone-unit-01
    command: ["node", "drone-simulator.js"]
    restart: unless-stopped
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    depends_on:
      - mosquitto
    networks:
      - drone-net

networks:
  drone-net:
    driver: bridge
